<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup - UAE Prayer Times</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 15px;
            font-size: 28px;
        }
        
        .message {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
            line-height: 1.6;
        }
        
        .progress-container {
            margin: 30px 0;
            text-align: left;
        }
        
        .step {
            display: flex;
            align-items: center;
            padding: 12px;
            margin-bottom: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            transition: all 0.3s;
        }
        
        .step.active {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
        }
        
        .step.completed {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
        }
        
        .step-icon {
            width: 24px;
            height: 24px;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        
        .step-icon.pending {
            color: #ccc;
        }
        
        .step-icon.active {
            color: #2196f3;
        }
        
        .step-icon.completed {
            color: #4caf50;
        }
        
        .step-text {
            font-size: 14px;
            color: #333;
        }
        
        .step.active .step-text {
            color: #2196f3;
            font-weight: 600;
        }
        
        .step.completed .step-text {
            color: #4caf50;
        }
        
        button {
            display: inline-block;
            padding: 16px 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">⚙️</div>
        <h1>Setup Required</h1>
        
        <div class="message">
            Click the button below to automatically configure credentials for the prayer times API.
        </div>
        
        <div id="initial-form">
            <form method="POST" action="/setup">
                <button type="submit" id="setup-btn">Run Setup</button>
            </form>
            
            <br>
            <a href="/" class="back-link">Back to Home</a>
        </div>
        
        <div id="progress-container" class="progress-container hidden">
            <div class="step" id="step-1">
                <div class="step-icon pending">○</div>
                <div class="step-text">Launching browser...</div>
            </div>
            <div class="step" id="step-2">
                <div class="step-icon pending">○</div>
                <div class="step-text">Navigating to AWQAF website...</div>
            </div>
            <div class="step" id="step-3">
                <div class="step-icon pending">○</div>
                <div class="step-text">Waiting for network traffic...</div>
            </div>
            <div class="step" id="step-4">
                <div class="step-icon pending">○</div>
                <div class="step-text">Extracting credentials...</div>
            </div>
            <div class="step" id="step-5">
                <div class="step-icon pending">○</div>
                <div class="step-text">Saving configuration...</div>
            </div>
        </div>
    </div>
    
    <script>
        document.getElementById('setup-btn').addEventListener('click', function() {
            document.getElementById('initial-form').classList.add('hidden');
            document.getElementById('progress-container').classList.remove('hidden');
            
            // Simulate progress steps
            const steps = ['step-1', 'step-2', 'step-3', 'step-4', 'step-5'];
            let currentStep = 0;
            
            function activateStep(stepId) {
                const step = document.getElementById(stepId);
                step.classList.remove('pending');
                step.classList.add('active');
                step.querySelector('.step-icon').textContent = '◉';
                step.querySelector('.step-icon').classList.remove('pending');
                step.querySelector('.step-icon').classList.add('active');
            }
            
            function completeStep(stepId) {
                const step = document.getElementById(stepId);
                step.classList.remove('active');
                step.classList.add('completed');
                step.querySelector('.step-icon').textContent = '✓';
                step.querySelector('.step-icon').classList.remove('active');
                step.querySelector('.step-icon').classList.add('completed');
            }
            
            // Activate and complete steps in sequence
            let delay = 0;
            steps.forEach((stepId, index) => {
                setTimeout(() => {
                    activateStep(stepId);
                    setTimeout(() => {
                        completeStep(stepId);
                    }, 2000);
                }, delay);
                delay += 3000;
            });
        });
    </script>
</body>
</html>
