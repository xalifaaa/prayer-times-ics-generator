services:
  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DEBUG=False
      - PLAYWRIGHT_BROWSERS_PATH=/home/appuser/.cache/ms-playwright
    volumes:
      - ./config.json:/app/config.json
      - ./browser_context.json:/app/browser_context.json
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SYS_CHROOT
