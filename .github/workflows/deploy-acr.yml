name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'visitors.json'
  workflow_dispatch:

env:
  IMAGE_NAME: prayer-times-ics-generator

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Azure Login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set Azure resource names
        run: |
          echo "ACR_NAME=${{ vars.ACR_NAME }}" >> $GITHUB_ENV
          echo "APP_NAME=${{ vars.APP_NAME }}" >> $GITHUB_ENV
          echo "RESOURCE_GROUP=${{ vars.RESOURCE_GROUP }}" >> $GITHUB_ENV

      - name: Get ACR login server
        run: |
          echo "ACR_LOGIN_SERVER=$(az acr show --name ${{ env.ACR_NAME }} --query loginServer -o tsv)" >> $GITHUB_ENV

      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker tag ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
                     ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Ensure App Service Plan exists
        run: |
          az appservice plan show --name "${{ env.APP_NAME }}-plan" --resource-group "${{ env.RESOURCE_GROUP }}" >/dev/null 2>&1 || \
          az appservice plan create --name "${{ env.APP_NAME }}-plan" --resource-group "${{ env.RESOURCE_GROUP }}" --is-linux --sku B1

      - name: Ensure Web App exists
        run: |
          az webapp show --name "${{ env.APP_NAME }}" --resource-group "${{ env.RESOURCE_GROUP }}" >/dev/null 2>&1 || \
          az webapp create --name "${{ env.APP_NAME }}" --resource-group "${{ env.RESOURCE_GROUP }}" --plan "${{ env.APP_NAME }}-plan" --deployment-container-image-name "mcr.microsoft.com/appsvc/staticsite:latest"

      - name: Ensure Application Insights exists
        run: |
          LOCATION=$(az group show --name "${{ env.RESOURCE_GROUP }}" --query location -o tsv)
          az monitor log-analytics workspace show --resource-group "${{ env.RESOURCE_GROUP }}" --workspace-name "${{ env.APP_NAME }}-logs" >/dev/null 2>&1 || \
          az monitor log-analytics workspace create --resource-group "${{ env.RESOURCE_GROUP }}" --workspace-name "${{ env.APP_NAME }}-logs" --location "$LOCATION" > /dev/null
          az monitor app-insights component show --app "${{ env.APP_NAME }}-insights" --resource-group "${{ env.RESOURCE_GROUP }}" >/dev/null 2>&1 || \
          az monitor app-insights component create --app "${{ env.APP_NAME }}-insights" --resource-group "${{ env.RESOURCE_GROUP }}" --location "$LOCATION" --kind web --workspace "${{ env.APP_NAME }}-logs" > /dev/null

      - name: Configure container image and ACR credentials
        run: |
          az acr update --name "${{ env.ACR_NAME }}" --admin-enabled true
          ACR_USER=$(az acr credential show --name "${{ env.ACR_NAME }}" --query username -o tsv)
          ACR_PASS=$(az acr credential show --name "${{ env.ACR_NAME }}" --query "passwords[0].value" -o tsv)
          echo "::add-mask::$ACR_PASS"
          az webapp config container set \
            --name "${{ env.APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --docker-custom-image-name "${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            --docker-registry-server-url "https://${{ env.ACR_LOGIN_SERVER }}" \
            --docker-registry-server-user "$ACR_USER" \
            --docker-registry-server-password "$ACR_PASS" > /dev/null

      - name: Configure app settings
        run: |
          AI_CONN=$(az monitor app-insights component show --app "${{ env.APP_NAME }}-insights" --resource-group "${{ env.RESOURCE_GROUP }}" --query connectionString -o tsv)
          AI_APPID=$(az monitor app-insights component show --app "${{ env.APP_NAME }}-insights" --resource-group "${{ env.RESOURCE_GROUP }}" --query appId -o tsv)
          # API key secrets are only returned on create; recreate the key each deploy
          if az monitor app-insights api-key show --app "${{ env.APP_NAME }}-insights" --resource-group "${{ env.RESOURCE_GROUP }}" --query "[?name=='site-reader'].name | [0]" -o tsv | grep -q site-reader; then
            az monitor app-insights api-key delete --app "${{ env.APP_NAME }}-insights" --resource-group "${{ env.RESOURCE_GROUP }}" --api-key site-reader --yes
          fi
          AI_KEY=$(az monitor app-insights api-key create --app "${{ env.APP_NAME }}-insights" --resource-group "${{ env.RESOURCE_GROUP }}" --api-key site-reader --read-properties ReadTelemetry --query apiKey -o tsv)
          echo "::add-mask::$AI_CONN"
          echo "::add-mask::$AI_KEY"
          az webapp config appsettings set \
            --name "${{ env.APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --settings WEBSITES_PORT=8080 STATIC_MODE=true \
              WEBSITE_WARMUP_PATH=/health WEBSITE_WARMUP_STATUSES=200 \
              APPLICATIONINSIGHTS_CONNECTION_STRING="$AI_CONN" \
              APPINSIGHTS_APP_ID="$AI_APPID" \
              APPINSIGHTS_API_KEY="$AI_KEY" > /dev/null

      - name: Enable App Service Health Check
        run: |
          az webapp config set \
            --name "${{ env.APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --generic-configurations '{"healthCheckPath":"/health"}' \
            --output none

      - name: Restart App Service
        run: |
          az webapp restart \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }}

      - name: Deployment Status
        run: |
          echo "Deployment complete!"
          echo "App URL: https://${{ env.APP_NAME }}.azurewebsites.net"
