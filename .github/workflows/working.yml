name: Working

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'visitors.json' ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run daily at 6:00 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.13'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff
        pip install -r requirements.txt
    
    - name: Run Ruff linting
      run: ruff check src/ main.py scripts/ tests/
    
    - name: Check Python syntax
      run: python -m py_compile main.py src/app.py src/generator.py scripts/pregenerate.py scripts/update_visitors.py tests/test_health.py tests/test_ui.py tests/test_visitors.py
    
    - name: Test help command
      run: python main.py --help
    
    - name: Run test suite
      run: python -m unittest discover -s tests -v

    - name: Check for security vulnerabilities
      run: |
        pip install pip-audit
        pip-audit --requirement requirements.txt || true
