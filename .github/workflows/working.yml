name: Working

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run daily at 6:00 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.13'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff
        pip install -r requirements.txt
        python -m playwright install chromium --with-deps
        python -m playwright install chromium --with-deps
    
    - name: Run Ruff linting
      run: ruff check src/ main.py
    
    - name: Check Python syntax
      run: python -m py_compile main.py
    
    - name: Test help command
      run: python main.py --help
    
    - name: Test credential extraction
      run: |
        python << 'PYEOF'
        import asyncio
        import importlib.util
        import sys
        from pathlib import Path

        script_path = Path('src/generator.py')
        spec = importlib.util.spec_from_file_location('generator', script_path)
        prayer_module = importlib.util.module_from_spec(spec)
        sys.modules['generator'] = prayer_module
        spec.loader.exec_module(prayer_module)

        async def test():
            print('Testing credential extraction...')
            try:
                creds = await prayer_module.extract_credentials()
                if creds:
                    print('SUCCESS: Credentials extracted')
                    return True
                else:
                    print('FAIL: No credentials extracted')
                    return False
            except Exception as e:
                print(f'ERROR: {e}')
                return False

        result = asyncio.run(test())
        sys.exit(0 if result else 1)
        PYEOF
    
    - name: Test ICS generation
      if: success()
      run: python main.py --year 2025 --month 1 --city "Dubai" --emirate "Dubai"
    
    - name: Check for security vulnerabilities
      run: |
        pip install pip-audit
        pip-audit --requirement requirements.txt || true
