name: Working

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff
        pip install -r requirements.txt
    
    - name: Run Ruff linting
      run: ruff check prayer-times-ics-generator.py
    
    - name: Check Python syntax
      run: python -m py_compile prayer-times-ics-generator.py
