name: Test Functionality

on:
  schedule:
    # Run daily at 6:00 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python -m playwright install chromium --with-deps
    
    - name: Test help and emirate listing
      run: |
        python prayer-times-ics-generator.py --help
        python prayer-times-ics-generator.py --list-emirates
    
    - name: Test credential extraction function
      run: python test_extraction.py
    
    - name: Test ICS generation with extracted credentials
      if: success()
      run: |
        python prayer-times-ics-generator.py --year 2025 --month 1 --city "Dubai" --emirate "Dubai"
        ls -la 2025/January/Dubai/
    
    - name: Run lint check
      run: ruff check prayer-times-ics-generator.py
